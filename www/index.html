<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#5b1411"><style>body{margin:0}[hidden]{display:none!important}</style><script src="ayar.js"></script><script src="reklam.js"></script><script src="magaza.js"></script></head><body><title>Yeşim Ustası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700;800&family=Ma+Shan+Zheng&display=swap">
<style>
/* Yeşim Ustası arayüzü — "gece kuyumcu tepsisi": üstte gece pazarı sahnesi, altta koyu lake ahşap tepsi.
   Kartlar pirinç kenarlı mücevher gözleri; yeşim yeşili = kazanç/onay, zincifre = risk/zarar, pirinç = başlık ve para. */
:root{
  --gece:#2b211b; --tepsi:#3a2d25; --tepsi2:#45362c; --oyuk:#211914; --cizgi:rgba(214,176,104,.32); --cizgi2:rgba(214,176,104,.58);
  --fildisi:#fbf2e1; --soluk:#d0bea4; --soluk2:#a8947c;
  --pirinc:#c9a15a; --pirinc2:#e7c27d; --yesim:#3daa72; --yesim2:#69cf98; --zincifre:#b8402e; --zincifre2:#e0715d; --lacivert:#2f4f86;
  --lake:#7d1f1a; --lake2:#4e110e; --murekkep:#2a1a12; --kagit:#efe4cf; --kagit2:#c9b48f; --tehlike:#b8402e;
  --f-bas:'Alegreya SC',Georgia,'Times New Roman',serif; --f-govde:'Alegreya Sans','Segoe UI',Roboto,Arial,sans-serif; --f-muhur:'Ma Shan Zheng','Alegreya SC',serif;
  --r1:8px; --r2:12px; --r3:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0d0907;color:var(--fildisi);font-family:var(--f-govde);font-size:15px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--lake2)}
#uyg{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--gece);position:relative;box-shadow:0 0 60px rgba(0,0,0,.6)}

/* ---- üst gösterge ---- */
#ust{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,#8a2620,#5a1410 70%,#4a100d);color:var(--fildisi);border-bottom:1px solid #2a0907;box-shadow:inset 0 -2px 0 var(--pirinc),0 4px 14px rgba(0,0,0,.45);position:relative;z-index:3}
.muhur{width:36px;height:36px;flex:none;border-radius:7px;background:radial-gradient(circle at 35% 30%,#d4513c,#9c2b1f);color:#fbeedd;font-family:var(--f-muhur);font-size:26px;line-height:36px;text-align:center;box-shadow:inset 0 0 0 2px rgba(251,238,221,.4),0 2px 4px rgba(0,0,0,.4)}
#ust h1{margin:0;font-family:var(--f-bas);font-weight:800;font-size:17px;letter-spacing:.03em;line-height:1.05;color:#fbeedd}
#ust small{display:flex;flex-direction:column;font-size:12px;line-height:1.2;color:#e9c9a8;font-variant-numeric:tabular-nums;white-space:nowrap}#ust small span:first-child{color:#fbeedd;font-weight:700}
#ust .sag{margin-left:auto;display:flex;align-items:center;gap:7px}
.para{position:relative;display:flex;align-items:center;gap:6px;font-family:var(--f-bas);font-weight:800;font-size:18px;color:var(--pirinc2);font-variant-numeric:tabular-nums;white-space:nowrap;
  background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.25));border:1px solid rgba(231,194,125,.45);border-radius:999px;padding:4px 11px 4px 5px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.para::before{content:"¥";display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:13px;color:#4a2e08;background:radial-gradient(circle at 35% 30%,#ffe6a8,#c9962f 70%,#8a6219);box-shadow:inset 0 0 0 1.5px rgba(90,58,10,.55)}
.para.eksi{color:#ff9b8a;border-color:rgba(255,155,138,.5)}
.paraFark{position:absolute;right:6px;top:100%;margin-top:4px;font-family:var(--f-bas);font-weight:800;font-size:14px;pointer-events:none;animation:farkUc 1.1s ease-out forwards;text-shadow:0 1px 2px #000}
.paraFark.art{color:var(--yesim2)}.paraFark.eks{color:var(--zincifre2)}
@keyframes farkUc{from{opacity:0;transform:translateY(-4px)}15%{opacity:1}to{opacity:0;transform:translateY(14px)}}
#ayarBtn{width:36px;height:36px;padding:0;font-size:18px;line-height:1;border-radius:50%;background:rgba(0,0,0,.28);color:#f2d9b5;border:1px solid rgba(231,194,125,.35)}
#gunBtn{height:36px;padding:0 12px;font-size:13.5px;border-radius:999px;background:linear-gradient(180deg,#f0cf8c,#c9a15a);color:#3a2408;border:1px solid #8a6522;box-shadow:0 2px 0 #5c4012,inset 0 1px 0 rgba(255,255,255,.5)}
#gunBtn:active{transform:translateY(1px);box-shadow:0 1px 0 #5c4012}

/* ---- haber şeridi ---- */
#haber{min-height:34px;display:flex;align-items:center;gap:8px;padding-block:6px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  background:#241a15;color:#fbf2e1;font-size:14px;line-height:1.3;border-bottom:1px solid #000;position:relative;z-index:2}
#haber::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--pirinc);box-shadow:0 0 8px var(--pirinc)}
#haber.iyi::before{background:var(--yesim2);box-shadow:0 0 8px var(--yesim2)}#haber.kotu::before{background:var(--zincifre2);box-shadow:0 0 8px var(--zincifre2)}
#haber.yeni{animation:haberGel .45s ease-out}@keyframes haberGel{from{background:#3a2814}}

/* ---- sahne ---- */
#sahneKap{position:relative;flex:none;background:#1d1310;box-shadow:0 6px 16px rgba(0,0,0,.5);z-index:1}
#sahneKap::after{content:"";position:absolute;inset:auto 0 0;height:12px;background:linear-gradient(transparent,rgba(43,33,27,.8));pointer-events:none}
#sahne{display:block;width:100%;height:100%;touch-action:none;will-change:transform;transform:translateZ(0)}

/* ---- panel (tepsi) ---- */
#icerik{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:14px 22px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));-webkit-overflow-scrolling:touch;
  background:radial-gradient(120% 60% at 50% 0%,#3a2c23,transparent 70%),var(--gece)}
#icerik::-webkit-scrollbar{width:0}
h2{display:flex;align-items:center;gap:10px;font-family:var(--f-bas);font-weight:800;font-size:19px;margin:4px 0 10px;letter-spacing:.02em;color:var(--pirinc2);text-wrap:balance}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--cizgi2),transparent)}
h3{font-family:var(--f-bas);font-weight:700;font-size:15.5px;margin:18px 0 8px;color:var(--pirinc);letter-spacing:.02em}
.not{color:var(--soluk);font-size:14px;line-height:1.5;margin:4px 0 12px;max-width:64ch}
b{font-weight:700}

/* ---- düğmeler ---- */
button{font-family:var(--f-govde);font-weight:700;font-size:14.5px;min-height:42px;border:1px solid var(--cizgi2);border-radius:var(--r2);cursor:pointer;color:var(--fildisi);background:linear-gradient(180deg,#5a473a,#47382d);padding:9px 14px;touch-action:manipulation;box-shadow:0 2px 0 #0b0806,inset 0 1px 0 rgba(255,255,255,.06);transition:filter .12s}
button:active{transform:translateY(1px);box-shadow:0 1px 0 #0b0806}
button:focus-visible{outline:2px solid var(--pirinc2);outline-offset:2px}
button:disabled{opacity:.42;cursor:default;transform:none;box-shadow:none;filter:saturate(.4)}
.btn-ana{background:linear-gradient(180deg,#f0cf8c,#c9a15a);color:#33200a;border-color:#7a5a1f;box-shadow:0 2px 0 #4f3610,inset 0 1px 0 rgba(255,255,255,.5)}
.btn-yesim{background:linear-gradient(180deg,#4fc086,#2e8f5c);color:#f2fff7;border-color:#1c5c3a;box-shadow:0 2px 0 #0f3a24,inset 0 1px 0 rgba(255,255,255,.3)}
.btn-lake{background:linear-gradient(180deg,#c9523e,#962f22);color:#fff3ec;border-color:#5e1a12;box-shadow:0 2px 0 #3a0e09,inset 0 1px 0 rgba(255,255,255,.25)}
.btn-rek{background:linear-gradient(180deg,#4064a4,#2a4678)!important;color:#fff!important;border-color:#182c52!important;box-shadow:0 2px 0 #0e1b33,inset 0 1px 0 rgba(255,255,255,.25)!important}
.btn-rek::before{content:"▶";display:inline-block;margin-right:6px;font-size:.75em;transform:translateY(-1px)}
.btn-kucuk{min-height:34px;padding:6px 11px;font-size:13px;border-radius:var(--r1)}
.satir{display:flex;gap:8px;flex-wrap:wrap}
.satir>button{flex:1;min-width:132px}

/* ---- kartlar: mücevher tepsisi gözleri ---- */
.liste{display:grid;gap:9px}
.kart,.gel,.gorev{display:flex;gap:11px;align-items:center;background:linear-gradient(180deg,#46372d,#3b2e26);border:1px solid var(--cizgi);border-radius:var(--r2);padding:9px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 1px 0 #000}
.kart[role=button]{cursor:pointer}.kart[role=button]:active{background:#504034}
.kart img.kres,.kart canvas{flex:none;border-radius:var(--r1);background:var(--oyuk);box-shadow:inset 0 2px 6px #000,0 0 0 1px var(--cizgi)}
.kart .orta,.gel .orta{flex:1;min-width:0}
.kart b,.gel b,.gorev b{font-family:var(--f-bas);font-size:15.5px;color:var(--fildisi)}
.kart .alt{font-size:13px;color:var(--soluk);line-height:1.4;margin-top:2px}
.kart .fiy{font-family:var(--f-bas);font-weight:800;font-size:16px;color:var(--pirinc2);font-variant-numeric:tabular-nums;white-space:nowrap}
.kart .ok{font-size:26px;color:var(--pirinc);opacity:.7;padding:0 2px}
.kart.secili{border-color:var(--pirinc);box-shadow:0 0 0 1px var(--pirinc) inset,0 0 18px rgba(201,161,90,.15)}
.kart.satici img.portre,.kapaliKart img{width:56px;height:80px;object-fit:contain;object-position:bottom;flex:none;border-radius:var(--r1);background:radial-gradient(circle at 50% 75%,#4a3527,#1b1310 72%);box-shadow:inset 0 0 0 1px var(--cizgi)}
.minik{display:flex;gap:5px;margin-top:6px}.minik canvas,.minik img.kres{border-radius:6px;box-shadow:none}
.ihaleKart{border:1px solid var(--pirinc);background:linear-gradient(180deg,#3a2a16,#251a10);box-shadow:0 0 0 1px rgba(201,161,90,.25) inset,0 0 22px rgba(201,161,90,.12);margin-bottom:10px}
.kapaliKart{border:1px dashed var(--cizgi2);background:linear-gradient(180deg,#251b16,#1c1410);margin-bottom:10px}
.siparisKart img{width:44px;height:64px;object-fit:contain;object-position:bottom;flex:none}
.urunKart img.kres,.urunKart canvas{background:radial-gradient(circle at 50% 40%,#4a3326,#160f0c)!important}
.gel img.ikon{width:54px;height:54px;object-fit:contain;flex:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.gel .sev{font-size:12px;color:var(--soluk)}
.cubuk{height:6px;border-radius:3px;background:var(--oyuk);margin-top:6px;overflow:hidden;box-shadow:inset 0 1px 2px #000}.cubuk i{display:block;height:100%;background:linear-gradient(90deg,#9a7637,var(--pirinc2));border-radius:3px}

/* ---- seçiciler ---- */
.cipler{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin:0 -14px 12px;padding:2px 14px 4px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 24px),transparent)}.cipler::-webkit-scrollbar{display:none}.cip{flex:none}.cip:disabled{opacity:.55;border-style:dashed}
.cip{min-height:34px;background:transparent;border:1px solid var(--cizgi2);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--fildisi);box-shadow:none}
.cip[aria-pressed="true"]{background:linear-gradient(180deg,#f0cf8c,#c9a15a);color:#33200a;border-color:#7a5a1f}
.araclar{display:flex;gap:4px;margin-bottom:10px;background:var(--oyuk);border:1px solid var(--cizgi);border-radius:var(--r2);padding:4px}
.araclar button{flex:1;min-height:38px;padding:7px 4px;background:transparent;border:0;box-shadow:none;color:var(--soluk)}
.araclar button[aria-pressed="true"]{background:linear-gradient(180deg,#5a473a,#47382d);color:var(--pirinc2);box-shadow:inset 0 0 0 1px var(--cizgi2)}

/* ---- ölçüler ---- */
.olc{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.olc div{background:var(--oyuk);border:1px solid var(--cizgi);border-radius:var(--r1);padding:8px 10px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.olc small{display:block;font-size:12px;color:var(--soluk)}
.olc span{font-family:var(--f-bas);font-weight:800;font-size:17px;color:var(--fildisi);font-variant-numeric:tabular-nums}
.bilgi{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:10px 0;padding:10px 12px;background:var(--oyuk);border-radius:var(--r1);border:1px solid var(--cizgi)}
.bilgi dt{color:var(--soluk)} .bilgi dd{margin:0;font-weight:500}
.bos{border:1px dashed var(--cizgi2);border-radius:var(--r2);padding:18px;text-align:center;color:var(--soluk);font-size:14px;line-height:1.5;background:rgba(0,0,0,.18)}

/* ---- sekme çubuğu ---- */
#alt{display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(180deg,#33271f,#241b16);border-top:1px solid #000;box-shadow:inset 0 1px 0 var(--cizgi2),0 -6px 18px rgba(0,0,0,.45);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);position:relative;z-index:3}
#alt button{position:relative;min-height:58px;background:none;border:0;box-shadow:none;color:var(--soluk);border-radius:0;padding:8px 1px 7px;font-family:var(--f-bas);font-size:12.5px;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:3px}
#alt button .ik{font-family:var(--f-muhur);font-size:21px;line-height:1;color:var(--soluk2);transition:color .15s}
#alt button[aria-selected="true"]{color:var(--pirinc2)}
#alt button[aria-selected="true"] .ik{color:var(--pirinc2);text-shadow:0 0 12px rgba(231,194,125,.55)}
#alt button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;border-radius:0 0 2px 2px;background:var(--pirinc2);box-shadow:0 0 10px var(--pirinc2)}
#alt button .rozet{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;line-height:18px;text-align:center;background:var(--zincifre);color:#fff;border-radius:9px;font-family:var(--f-govde);font-size:11px;font-weight:800;padding:0 5px;box-shadow:0 0 0 2px #140e0b}

/* ---- alt pencere ---- */
#perde{position:fixed;inset:0;background:rgba(8,5,4,.62);z-index:20;display:flex;align-items:flex-end;justify-content:center;}
#perde:not([hidden]){animation:perdeAc .2s ease-out}
@keyframes perdeAc{from{background:rgba(8,5,4,0)}}
#kagit{position:relative;background:linear-gradient(180deg,#45362c,#33271f 40%);color:var(--fildisi);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:var(--r3) var(--r3) 0 0;border-top:1px solid var(--cizgi2);
  padding-block:22px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -10px 40px rgba(0,0,0,.6)}
#kagit::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--cizgi2)}
#perde:not([hidden]) #kagit{animation:kagitGel .26s cubic-bezier(.2,.8,.2,1)}
@keyframes kagitGel{from{transform:translateY(40px);opacity:.4}}
#kagit canvas.buyuk{display:block;width:100%;border-radius:var(--r2);background:radial-gradient(#3a2a20,#120c0a);touch-action:none;box-shadow:inset 0 0 0 1px var(--cizgi),inset 0 4px 14px #000}
.tezgahBas{display:flex;gap:12px;align-items:flex-end;margin-bottom:8px}.tezgahBas h2{margin:0}.tezgahBas h2::after{display:none}
.portreBuyuk{width:88px;height:128px;object-fit:contain;object-position:bottom;flex:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6))}
.soz{font-style:italic;color:#d9c3a0;margin-top:4px}
.fenerYazi{color:var(--yesim2)!important;font-weight:600}
.ihaleLog{font-size:13px;color:#d8c9b0;background:var(--oyuk);border:1px solid var(--cizgi);border-radius:var(--r1);padding:8px 10px;margin:8px 0;display:grid;gap:3px}
.kesimSonuc{text-align:center;margin:10px 0}.kesimSonuc b{display:block;font-family:var(--f-bas);font-size:27px;line-height:1.15}.kesimSonuc .iyi{color:var(--yesim2)}.kesimSonuc .kotu{color:var(--zincifre2)}.kesimSonuc .efsane{text-transform:uppercase;color:#ffd56b;text-shadow:0 0 18px rgba(255,213,107,.45)}

/* ---- pazar üst bölümü ---- */
.ipucu{border-left:3px solid var(--pirinc);padding-left:10px}
.siraOzet{display:flex;gap:12px;align-items:center;background:linear-gradient(180deg,#4a3820,#3a2c19);border:1px solid var(--pirinc);border-radius:var(--r2);padding:12px;margin-bottom:8px}.siraNo{font-family:var(--f-bas);font-weight:800;font-size:34px;color:var(--pirinc2);min-width:64px;text-align:center}
.siraTablo{display:grid;gap:3px}.siraAra{text-align:center;color:var(--soluk2);line-height:1;padding:2px 0}.siraSatir{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:var(--r1);background:var(--oyuk);border:1px solid rgba(214,176,104,.12);font-variant-numeric:tabular-nums}.siraSatir .sn{color:var(--soluk);font-weight:700}.siraSatir .pr{font-family:var(--f-bas);font-weight:800;color:var(--pirinc2)}.siraSatir.ilk .sn{color:var(--pirinc2)}.siraSatir.ben{background:linear-gradient(90deg,#2f5a40,#24402f);border-color:var(--yesim2)}.siraSatir.ben .ad{font-weight:800}
.olay{display:block;background:linear-gradient(90deg,rgba(201,161,90,.16),rgba(201,161,90,.04));color:#eadcc3;border:1px solid var(--cizgi);border-radius:var(--r2);padding:9px 12px;margin:4px 0 10px;font-size:13.5px}
.olay b{color:var(--pirinc2)}
.hediye{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:0 0 12px}
.hediye button{min-height:56px;padding:8px 4px;font-size:13px;line-height:1.2;border-radius:var(--r2)}
.hediye button small{display:block;font-weight:500;opacity:.85;margin-top:2px}

/* ---- koleksiyon, başarım, görev ---- */
.koleksiyon{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.kol{border-radius:var(--r1);padding:9px 6px;text-align:center;font-size:12px;line-height:1.25;background:var(--oyuk);border:1px solid var(--cizgi);color:var(--fildisi)}
.kol i{display:block;height:34px;width:34px;border-radius:50%;margin:0 auto 6px;box-shadow:inset -4px -5px 8px rgba(0,0,0,.35),inset 3px 3px 6px rgba(255,255,255,.45),0 0 12px rgba(0,0,0,.5)}
.kol small{color:var(--soluk)}
.kol.yok{color:var(--soluk2)}.kol.yok i{background:repeating-linear-gradient(45deg,#2c211b 0 4px,#231a15 4px 8px)!important;box-shadow:inset 0 0 0 1px var(--cizgi)}
.gorev{border-left:3px solid var(--pirinc);margin-bottom:8px}.gorev.hazir{border-left-color:var(--yesim2);background:linear-gradient(180deg,#1f2b22,#1a221b)}.gorev.usta{display:block;border-left-color:var(--zincifre)}
.gorev small{color:var(--soluk);display:block;font-size:12px}
.basarimlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.bas{background:var(--oyuk);border:1px solid rgba(201,161,90,.1);border-radius:var(--r1);padding:8px 9px}
.bas b{display:block;font-size:13px;color:var(--soluk2)}.bas small{font-size:11.5px;color:var(--soluk2)}
.bas.var{background:linear-gradient(180deg,#352817,#241a10);border-color:var(--cizgi2)}.bas.var b{color:var(--pirinc2)}.bas.var small{color:var(--soluk)}

/* ---- ürün seçimi (kesim) ---- */
#elmasBtn{height:36px;padding:0 10px 0 11px;display:flex;align-items:center;gap:4px;border-radius:18px;background:rgba(0,0,0,.28);color:#d9f4ff;border:1px solid rgba(150,220,255,.45);font-weight:800;font-size:15px}
